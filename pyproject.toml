[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redgap"
version = "0.2.1"
description = "Automated, MITRE ATT&CK-mapped offense<->detection coverage harness. Finds the red gaps in your detection coverage."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "befnoz" }]
keywords = ["security", "detection-engineering", "mitre-attack", "sigma", "purple-team", "coverage"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "pysigma==1.5.0",
]

[project.optional-dependencies]
# The LLM planner is strictly optional. The whole deterministic path runs without it.
llm = ["anthropic>=0.40"]
dev = ["ruff>=0.6", "pytest>=8", "pytest-cov>=5", "pre-commit>=3.8", "mypy>=1.11"]

[project.scripts]
redgap = "redgap.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/redgap"]

# Ship the data trees INSIDE the package so a non-editable install (`pip install .`,
# `pipx install redgap`) can resolve rules/fixtures/lab via importlib.resources and run
# `redgap run` from any directory. redgap/_resources.py reads them from here.
[tool.hatch.build.targets.wheel.force-include]
"rules" = "redgap/rules"
"fixtures" = "redgap/fixtures"
"lab" = "redgap/lab"

[tool.hatch.build.targets.sdist]
include = ["src", "rules", "fixtures", "lab", "tests", "docs", "scripts", "README.md", "LICENSE", "NOTICE"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
# Lets the test suite import the package straight from src/ without an editable install,
# so the deterministic guardrail tests (allowlist, models) run with zero dependencies.
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
