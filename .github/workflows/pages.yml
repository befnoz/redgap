name: pages

# Publishes docs/ (the RedGap dashboard, index.html) to GitHub Pages.
# Manual on purpose: run it from the Actions tab AFTER enabling Pages
# (Settings -> Pages -> Source = "GitHub Actions"), so a normal push never
# produces a red "pages" run before Pages is switched on.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
