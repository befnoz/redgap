name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the workflow only reads the repo; no job needs write scopes.
permissions:
  contents: read

# The headline proof: the entire offense->detection->coverage loop runs OFFLINE in
# REPLAY, with no API key and no cloud, on every push.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (no LLM extra - CI must run without an API key)
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test (deterministic loop in REPLAY)
        env:
          COVERAGE_LLM: "0"
        run: python -m pytest -q

      - name: Run the coverage loop offline (one command, no key, no Docker)
        run: redgap run --json > coverage-ci.json

      - name: Prove honesty offline (fixtures authentic, deterministic, planner-independent)
        run: redgap verify

      - name: Run the adaptive gap-driven loop offline (writes + checks the attack-path)
        run: |
          redgap run --adaptive
          python - <<'PY'
          import json
          ap = json.load(open("out/attack-path.json"))
          grid = {t["id"]: t["detected"] for t in json.load(open("out/coverage.json"))["techniques"]}
          assert ap["schema"] == "redgap.attack_path/v1", ap["schema"]
          assert ap["steps"], "adaptive run produced no steps"
          bad = [s["technique_id"] for s in ap["steps"] if s["detected"] != grid[s["technique_id"]]]
          assert not bad, f"attack-path contradicts the coverage grid: {bad}"
          print("adaptive OK:", ap["summary"])
          PY

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            out/
            coverage-ci.json

  # Prove the built wheel is self-contained: install it NON-editable into a clean env
  # and run the loop from an unrelated directory, so a missing rules/fixtures data file
  # (which the editable install would mask) fails here.
  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the wheel and install it non-editable
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
          python -m pip install dist/*.whl

      - name: Run the loop from a directory that is not the source tree
        run: |
          cd "$RUNNER_TEMP"
          redgap version
          redgap run --json > "$RUNNER_TEMP/coverage-installed.json"
          python -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['summary']['techniques']==len(d['techniques'])>0, d['summary']" "$RUNNER_TEMP/coverage-installed.json"
          redgap run --adaptive --out "$RUNNER_TEMP/adaptive-out"
          python -c "import json,os,sys; a=json.load(open(os.path.join(sys.argv[1],'attack-path.json'))); assert a['steps'] and a['schema']=='redgap.attack_path/v1', a" "$RUNNER_TEMP/adaptive-out"
