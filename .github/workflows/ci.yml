name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The headline proof: the entire offense->detection->coverage loop runs OFFLINE in
# REPLAY, with no API key and no cloud, on every push.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (no LLM extra — CI must run without an API key)
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test (deterministic loop in REPLAY)
        env:
          COVERAGE_LLM: "0"
        run: python -m pytest -q

      - name: Run the coverage loop offline (one command, no key, no Docker)
        run: redgap run --json > coverage-ci.json

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            out/
            coverage-ci.json

  # Prove the built wheel is self-contained: install it NON-editable into a clean env
  # and run the loop from an unrelated directory, so a missing rules/fixtures data file
  # (which the editable install would mask) fails here.
  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the wheel and install it non-editable
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
          python -m pip install dist/*.whl

      - name: Run the loop from a directory that is not the source tree
        run: |
          cd "$RUNNER_TEMP"
          redgap version
          redgap run --json > "$RUNNER_TEMP/coverage-installed.json"
          python -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['summary']['techniques']==5, d['summary']" "$RUNNER_TEMP/coverage-installed.json"
