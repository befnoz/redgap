<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" font-family="ui-monospace, 'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, monospace">
  <defs>
    <radialGradient id="glowR" cx="82%" cy="32%" r="54%">
      <stop offset="0%" stop-color="#ff4d55" stop-opacity="0.22"/>
      <stop offset="72%" stop-color="#ff4d55" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowG" cx="4%" cy="92%" r="46%">
      <stop offset="0%" stop-color="#34d178" stop-opacity="0.10"/>
      <stop offset="72%" stop-color="#34d178" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>

  <rect width="1280" height="640" fill="#06080c"/>
  <rect width="1280" height="640" fill="url(#glowR)"/>
  <rect width="1280" height="640" fill="url(#glowG)"/>
  <rect x="0" y="636" width="1280" height="4" fill="#ff4d55" opacity="0.85"/>

  <!-- ===== LEFT column (x: 88 .. ~700) ===== -->
  <g transform="translate(88,116)">
    <g fill="#34d178">
      <rect x="0"   y="0"   width="40" height="40" rx="9"/>
      <rect x="50"  y="0"   width="40" height="40" rx="9"/>
      <rect x="100" y="0"   width="40" height="40" rx="9"/>
      <rect x="0"   y="50"  width="40" height="40" rx="9"/>
      <rect x="100" y="50"  width="40" height="40" rx="9"/>
      <rect x="0"   y="100" width="40" height="40" rx="9"/>
      <rect x="50"  y="100" width="40" height="40" rx="9"/>
      <rect x="100" y="100" width="40" height="40" rx="9"/>
    </g>
    <rect x="50" y="50" width="40" height="40" rx="9" fill="#ff4d55" filter="url(#soft)"/>
    <rect x="50" y="50" width="40" height="40" rx="9" fill="#ff4d55"/>
  </g>

  <text x="86" y="368" font-size="100" font-weight="700" letter-spacing="-4" fill="#e8edf5">Red<tspan fill="#ff4d55">Gap</tspan></text>
  <text x="90" y="420" font-size="27" font-weight="600" fill="#e8edf5">Find the <tspan fill="#ff4d55">red gaps</tspan> in your detection.</text>
  <text x="90" y="458" font-size="16.5" fill="#9aa6b8">51 benign ATT&amp;CK techniques on real telemetry. It walks an</text>
  <text x="90" y="482" font-size="16.5" fill="#9aa6b8"><tspan fill="#e8edf5">adaptive attack path</tspan> and grades your Sigma rules.</text>

  <g font-size="16" text-anchor="middle">
    <g transform="translate(90,512)">
      <rect width="200" height="42" rx="11" fill="#0e1420" stroke="#1e2736"/>
      <text x="100" y="27" fill="#e8edf5">adaptive <tspan fill="#6ef0a6" font-weight="700">attack path</tspan></text>
    </g>
    <g transform="translate(304,512)">
      <rect width="176" height="42" rx="11" fill="#0e1420" stroke="#ff4d55"/>
      <text x="88" y="27" fill="#ff8a8f" font-weight="700">SILENT rules</text>
    </g>
    <g transform="translate(494,512)">
      <rect width="214" height="42" rx="11" fill="#0e1420" stroke="#1e2736"/>
      <text x="107" y="27" fill="#9aa6b8">no AI in the verdict</text>
    </g>
  </g>

  <!-- ===== RIGHT column: kill-chain ribbon (the flagship) ===== -->
  <g transform="translate(806,196)">
    <text x="0" y="0" font-size="13" letter-spacing="3" fill="#66718a">THE ATTACK PATH</text>

    <!-- spine -->
    <rect x="8" y="86" width="360" height="3" rx="1.5" fill="#2a3547"/>

    <!-- nodes: green detected, two red rule-gap holes (glow), one amber base-rate -->
    <g>
      <circle cx="20"  cy="87.5" r="9" fill="#34d178"/>
      <circle cx="78"  cy="87.5" r="9" fill="#34d178"/>
      <circle cx="136" cy="87.5" r="9" fill="#34d178"/>
      <circle cx="194" cy="87.5" r="12" fill="#2c1015" stroke="#ff4d55" stroke-width="2" filter="url(#soft)"/>
      <circle cx="194" cy="87.5" r="12" fill="#2c1015" stroke="#ff4d55" stroke-width="2"/>
      <circle cx="252" cy="87.5" r="9" fill="#34d178"/>
      <circle cx="310" cy="87.5" r="10" fill="#2a2010" stroke="#f4b942" stroke-width="2"/>
      <circle cx="368" cy="87.5" r="12" fill="#2c1015" stroke="#ff4d55" stroke-width="2" filter="url(#soft)"/>
      <circle cx="368" cy="87.5" r="12" fill="#2c1015" stroke="#ff4d55" stroke-width="2"/>
    </g>

    <!-- tactic labels above a few nodes -->
    <g font-size="11" fill="#66718a" text-anchor="middle">
      <text x="20"  y="64">DISCOVERY</text>
      <text x="194" y="64" fill="#ff8a8f">CRED&#160;ACCESS</text>
      <text x="368" y="64" fill="#ff8a8f">COLLECTION</text>
    </g>

    <!-- depth beads hanging from the two red nodes (the gap-chase) -->
    <g>
      <rect x="168" y="112" width="52" height="3" rx="1.5" fill="#ff4d55" opacity="0.7" transform="rotate(90 194 113.5)"/>
      <rect x="168" y="128" width="128" height="52" rx="12" fill="#2c1015" stroke="#ff4d55"/>
      <text x="180" y="150" font-size="13" font-weight="700" fill="#ff8a8f">T1552.004</text>
      <text x="180" y="169" font-size="11" fill="#9aa6b8">gap &#183; rule</text>

      <rect x="342" y="112" width="52" height="3" rx="1.5" fill="#ff4d55" opacity="0.7" transform="rotate(90 368 113.5)"/>
      <rect x="304" y="128" width="128" height="52" rx="12" fill="#2c1015" stroke="#ff4d55"/>
      <text x="316" y="150" font-size="13" font-weight="700" fill="#ff8a8f">T1560.001</text>
      <text x="316" y="169" font-size="11" fill="#9aa6b8">gap &#183; rule</text>
    </g>

    <text x="8" y="228" font-size="16.5" fill="#9aa6b8">breadth, then depth. <tspan fill="#e8edf5" font-weight="600">prove it.</tspan></text>
  </g>

  <text x="88" y="600" font-size="16" fill="#66718a">github.com/befnoz/redgap   &#183;   pip install redgap</text>
</svg>
